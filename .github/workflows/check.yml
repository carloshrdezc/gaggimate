on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install platformio==6.1.19
      - name: Run static code analysis for display
        # CAR-341: this step now GATES (no continue-on-error). It analyses the
        # hand-written display sources (src/display/) and excludes the generated
        # LVGL UI (src/display/ui). Threshold stays at medium to match the
        # controller step; if pre-existing medium findings surface here, raise to
        # --fail-on-defect=high or add inline `// cppcheck-suppress` with a note.
        run: platformio check -e display --fail-on-defect=medium -f "-<*>" -f "+<src/display/>" -f "-<src/display/ui>"
      - name: Run static code analysis for controller
        run: platformio check -e controller --fail-on-defect=medium -f "-<*>" -f "+<src/controller/>"
