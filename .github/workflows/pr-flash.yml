name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# This workflow only builds and uploads the PR firmware as a GitHub Actions
# artifact (see the "Upload PR artifacts" step), so read-only is all it needs.
# PRO-250: the former `publish` job that mirrored the firmware to a pr-<N>/
# subdir on the gh-pages branch was removed — it accumulated one dir per PR
# forever and nothing consumed that Pages URL. The artifact on the PR checks
# page is the firmware's home.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-tags: true
          fetch-depth: 0
          submodules: 'recursive'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install platformio==6.1.19
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Add version
        run: |
          mkdir -p out
          git tag -d nightly 2>/dev/null || true
          git describe --tags --dirty > out/version.txt
      - name: Build Web
        run: ./scripts/build_spiffs.sh
      - name: Build controller
        run: |
          pio run -e controller
          mv .pio/build/controller/firmware.bin out/board-firmware.bin
          mv .pio/build/controller/partitions.bin out/board-partitions.bin
          mv .pio/build/controller/bootloader.bin out/board-bootloader.bin
      - name: Build display
        run: |
          pio run -e display
          mv .pio/build/display/firmware.bin out/display-firmware.bin
          mv .pio/build/display/partitions.bin out/display-partitions.bin
          mv .pio/build/display/bootloader.bin out/display-bootloader.bin
      - name: Build display FS
        run: |
          pio run -t buildfs -e display
          cp .pio/build/display/spiffs.bin out/display-filesystem.bin
      - name: Upload PR artifacts
        # Always available on the PR's checks page, including for fork PRs.
        # This is the firmware's home now that the gh-pages publish job is gone
        # (PRO-250).
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-firmware
          path: ./out
          retention-days: 14

