name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Workflow-level permissions are read-only by default. The `publish` job below
# narrows to the elevated permissions it actually needs, scoped to that job.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-tags: true
          fetch-depth: 0
          submodules: 'recursive'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install platformio==6.1.19
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Add version
        run: |
          mkdir -p out
          git tag -d nightly 2>/dev/null || true
          git describe --tags --dirty > out/version.txt
      - name: Build Web
        run: ./scripts/build_spiffs.sh
      - name: Build controller
        run: |
          pio run -e controller
          mv .pio/build/controller/firmware.bin out/board-firmware.bin
          mv .pio/build/controller/partitions.bin out/board-partitions.bin
          mv .pio/build/controller/bootloader.bin out/board-bootloader.bin
      - name: Build display
        run: |
          pio run -e display
          mv .pio/build/display/firmware.bin out/display-firmware.bin
          mv .pio/build/display/partitions.bin out/display-partitions.bin
          mv .pio/build/display/bootloader.bin out/display-bootloader.bin
      - name: Build display FS
        run: |
          pio run -t buildfs -e display
          cp .pio/build/display/spiffs.bin out/display-filesystem.bin
      - name: Upload PR artifacts
        # Always available on the PR's checks page, including for fork PRs
        # where the publish job below is skipped.
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-firmware
          path: ./out
          retention-days: 14

  publish:
    # Only same-repo PRs run this job. Fork PRs get a read-only GITHUB_TOKEN
    # so the gh-pages push would fail anyway; skipping makes that explicit
    # and avoids declaring write permissions we can't actually use.
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    continue-on-error: true
    steps:
      - name: Download PR artifacts
        uses: actions/download-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-firmware
          path: ./out
      - name: Deploy to GitHub Pages subdirectory
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          destination_dir: pr-${{ github.event.pull_request.number }}
          publish_branch: gh-pages
