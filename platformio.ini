; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
; PRO-293 (step 5 of PRO-288): switch the ESP32 toolchain from Espressif's
; espressif32@6.12.0 (Arduino core 2.0.17 / IDF 4.4 / xtensa gcc 8.4.0) to the
; pioarduino community fork of platform-espressif32, release 55.03.39
; (= Arduino-esp32 core 3.3.9 / IDF 5.5.4 / xtensa gcc 14.2.0). This is the
; exact release validated core-3.x-ready by the PRO-292 spike
; (docs/core3x-dep-revalidation.md). With that platform bump in place the
; xtensa gcc 14.2.0 toolchain supports C++20, so PRO-294 (step 6) flipped the
; firmware + native C++ standard from gnu++17 to gnu++20 (see [display_common]).
; NOTE: stock PlatformIO-core cannot install the core-3.x framework package;
; build with the pioarduino fork of platformio-core (see the spike doc appendix).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
check_flags = 
	; PRO-293: the pioarduino core-3.x toolchain ships GCC 14.2.0, whose libstdc++
	; headers (e.g. <type_traits>) use C++ constructs that the cppcheck 2.11 bundled
	; with platformio 6.1.19 cannot parse — it raises a breaking `syntaxError` while
	; following includes into the toolchain/framework system headers, aborting the
	; whole gate. We never analyze those headers (only src/<display|controller>/ is
	; in scope via the -f filters), so suppress findings under the toolchain and
	; framework package dirs. `unmatchedSuppression` is suppressed so the patterns
	; stay quiet on runs where a given system path isn't pulled in.
	cppcheck: --enable=all --inline-suppr --suppress=*:*/.pio/* --suppress=*:*/toolchain-xtensa-esp-elf/* --suppress=*:*/framework-arduinoespressif32/* --suppress=*:*/framework-arduinoespressif32-libs/* --suppress=unmatchedSuppression
monitor_filters =
    esp32_exception_decoder
    time
    default

[display_common]
build_flags =
    ; C++ standard: gnu++20. PRO-293 (step 5 of PRO-288) replaced the old
    ; espressif32@6.12.0 / gcc 8.4.0 toolchain — which rejected -std=gnu++20
    ; (unrecognized option) and lacked <span>/<ranges>/concepts — with the
    ; pioarduino Arduino-esp32 3.x platform whose xtensa gcc 14.2.0 fully
    ; supports C++20. PRO-294 (step 6) is that flip. See docs/cpp-standard-spike.md.
    ; Keep gnu++ last so the later-flag-wins ordering selects the GNU dialect.
    -std=c++20
    -std=gnu++20
    ; CAR-341: compiler hardening. -Wall -Wextra surface bug-prone constructs on
    ; the firmware build. NOT -Werror on purpose — keeping CI green matters more
    ; than zero warnings today (see issue: "consider -Werror once clean").
    -Wall
    -Wextra
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_CONF_PATH="${platformio.src_dir}/display/lv_conf.h"
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DLV_CONF_SUPPRESS_DEFINE_CHECK
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_CMN
    ; PRO-358: cap the mbedTLS handshake in/out content-length buffers. These are
    ; the single largest TRANSIENT internal-DRAM (MALLOC_CAP_INTERNAL) draw of the
    ; OTA HTTPS version-check handshake (the source of `SSL - Memory allocation
    ; failed (-32512)` under HomeKit + BLE + WiFi + mDNS — see OtaCheckPolicy.h,
    ; whose header comment already assumes these caps exist). The IDF default is
    ; 16384 B per buffer; the GitHub OTA version-check + certificate-bundle TLS
    ; handshake fit comfortably in 4096 B (small GET + JSON release metadata, no
    ; large payload transfer over the TLS record layer — the firmware image itself
    ; is fetched by the OTA download path, not this version check). Dropping
    ; 16384 -> 4096 reclaims ~12 KB of contiguous internal DRAM off the handshake's
    ; peak, which is what lets the largest-block clear the 48 KB OTA floor. This is
    ; the primary reclamation lever. On-hardware TLS-completes validation
    ; (version check actually reaches GitHub) is Carlos's manual post-merge step.
    -DCONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
    -DCONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
    -Os
    -DCONFIG_MAX_FILENAME_LEN=64
    -DCONFIG_MAX_URL_LEN=128
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=0
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
    -DCONFIG_ASYNC_TCP_PRIORITY=10
    ; PRO-358: AsyncTCP event-queue depth. Each queued slot is a fixed internal-DRAM
    ; (MALLOC_CAP_INTERNAL) allocation held for the life of the async_tcp task, so a
    ; deep queue is steady-state internal-DRAM pressure. 64 was oversized for this
    ; device: a single-user espresso machine with DEFAULT_MAX_WS_CLIENTS=4 never
    ; approaches a 64-deep event burst (WS control traffic is small JSON + a handful
    ; of HTTP asset fetches). Halving 64 -> 32 trims the task's resident internal
    ; footprint while staying comfortably above the realistic burst depth, so web-UI
    ; responsiveness is preserved. Kept alongside the mbedTLS caps above to help the
    ; largest-block clear the 48 KB OTA floor. (Queue size, NOT client cap: WS
    ; client cap stays 4 so multi-tab / mobile+desktop use does not regress.)
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=32
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DDEFAULT_MAX_WS_CLIENTS=4
lib_deps_default =
    FS
    SPIFFS
    LittleFS
    Wire
    SPI
    ble_ota_dfu
    ; PRO-290: NimBLE-Arduino 1.4.3 -> 2.x. 1.x cannot build on Arduino-esp32 3.x
    ; (NimBLE-Arduino#641); 2.x supports both the IDF 4.4 host (this 6.12.0
    ; platform) and 5.x, so the BLE API churn is staged here BEFORE the platform
    ; bump (PRO-293). Pinned to a concrete 2.x release; upstream's recommended
    ; PlatformIO floor is @^2.1.0. See docs/nimble-2x-migration-spike.md.
    ; PRO-330: bumped 2.2.3 -> 2.5.0 (latest 2.x). On the pioarduino Arduino-esp32
    ; 3.3.9 / IDF 5.5.4 platform (PRO-293), 2.2.3 panics during esp_bt_controller_init
    ; on the display board (LoadProhibited in btdm_controller_deinit_internal ->
    ; vTaskDelete -> uxListRemove). NimBLE-Arduino 2.3.8 fixed "Crash on init with
    ; esp32 devices with Arduino core 3.3.7 and later"; 2.4.0 fixed a createServer
    ; pre-init crash. Both land between 2.2.3 and 2.5.0. Kept on the PlatformIO
    ; NimBLE-Arduino library (NOT the esp-nimble-cpp IDF managed component) to avoid
    ; the duplicate-symbol hazard noted on the scales-fork pin below. Keep this pin
    ; and [env:controller]'s in lockstep.
    h2zero/NimBLE-Arduino@2.5.0
    https://github.com/ESP32Async/AsyncTCP.git#v3.4.9
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.9.1
    bblanchon/ArduinoJson@7.4.3
    256dpi/MQTT@2.5.3
    ; PRO-290: scales fork pinned to 135572a ("upgrade NimBLE-Arduino from 1.4.x
    ; to 2.5.0") — the NimBLE-2.x API port (NimBLEScanCallbacks / setScanCallbacks
    ; / onResult(const NimBLEAdvertisedDevice*) / getAddress().getVal()) that STILL
    ; consumes the PlatformIO NimBLE-Arduino library. We deliberately do NOT use the
    ; later tag v2.0.0 (98d45b8): it includes 130942f which drops the NimBLE-Arduino
    ; dep in favor of the esp-nimble-cpp IDF managed component + pioarduino, which
    ; would duplicate NimBLE symbols on this espressif32@6.12.0 path. Moving to that
    ; line is part of the platform bump (PRO-293), not this slice. Same src/-only
    ; layout (no library.json) as the prior #5f8f2cd pin, so it drops in cleanly.
    ; See docs/spike-nimble-2x/findings.md §3 and §6.
    https://github.com/gaggimate/esp-arduino-ble-scales#135572a
    ; PRO-293: HomeSpan 1.9.1 -> 2.x. HomeSpan 2.0.0+ requires Arduino-esp32
    ; core >= 3.0.2 and 1.x will NOT compile on core 3.x; conversely 2.x will
    ; not build on core 2.x. Bumped in lockstep with the platform flip (PRO-292
    ; validated this as a platform-exclusive bump). See docs/core3x-dep-revalidation.md.
    homespan/HomeSpan@2.1.8
    links2004/WebSockets@2.7.3

[env:display]
board = LilyGo-T-RGB
; Build the data/ filesystem image as LittleFS (uploadfs / OTA filesystem.bin).
; LittleFS replaces SPIFFS for the web partition: SPIFFS stat() is O(whole
; filesystem) and starved the async_tcp task under load (task-WDT reboot). The
; firmware mounts it via LittleFS.begin(); both must agree. Inherited by the
; display-headless* envs that extend this one. [GM-90]
board_build.filesystem = littlefs
upload_speed = 921600
build_src_filter = -<*> +<display/> +<version.h> +<stable_versions.h>
extra_scripts =
	pre:scripts/auto_firmware_version.py
	; Ensures src/display/webassets/* (embedded web UI) exists before compile;
	; stubs an empty bundle if build_webui.sh hasn't been run. [GM-106]
	pre:scripts/embed_webui_pre.py
	pre:scripts/generate_stable_versions.py
lib_deps =
    ${display_common.lib_deps_default}
    lewisxhe/SensorLib @ 0.2.3
    ; PRO-291: bodmer/TFT_eSPI was REMOVED here. It was a dead dependency — no
    ; firmware source has ever #included it (verified across full git history):
    ; the LilyGo-T-RGB / Waveshare panels are driven by the ESP-IDF esp_lcd RGB
    ; panel API (drivers/LilyGo-T-RGB, drivers/Waveshare) and the AMOLED panel by
    ; Arduino_GFX (moononournation/GFX Library for Arduino, below); LVGL flushes
    ; via Display::pushColors() (drivers/common/LV_Helper.cpp), never via TFT_eSPI.
    ; As an explicit lib_deps entry, PlatformIO still COMPILED TFT_eSPI.cpp into
    ; every display build, which is exactly the Arduino-esp32 3.x REG_SPI_BASE S3
    ; boot/compile blocker flagged by docs/espressif32-7x-platform-bump-spike.md
    ; (TFT_eSPI#3329). Dropping the unused dep makes the panel path core-3.x-ready
    ; for PRO-293 (it never depended on TFT_eSPI) with zero behavior change on the
    ; current espressif32@6.12.0 / core-2.x toolchain. See PRO-288 step 3 / PRO-291.
	lvgl/lvgl @ 8.4.0
	; PRO-293: GFX 1.5.9 -> 1.6.6. v1.6.5 "Fixed build error with ESP32 Arduino
	; core 3.x" (spiFrequencyToClockDiv() signature changed to (spi_t*, uint32_t));
	; 1.5.9 fails to compile on core 3.x, and >=1.6.x #include "esp32-hal-periman.h"
	; which does not exist on core 2.x — platform-exclusive bump, in lockstep with
	; the flip. v1.6.3 renames (RGB565_GREEN->RGB565_LIME, u8g2 _t_->_h_ fonts) are
	; unused by GaggiMate source (verified in PRO-292). See docs/core3x-dep-revalidation.md.
	moononournation/GFX Library for Arduino @ 1.6.6
    ; PRO-241: nanopb infra slice 1. The runtime + its codegen extra_script ship
    ; in this package; comms.pb.{c,h} are generated at build time into $BUILD_DIR
    ; (gitignored, never committed) from the proto named in custom_nanopb_protos.
    ; No call sites yet — this slice only proves the runtime compiles + links.
    nanopb/Nanopb @ ^0.4.9
; PRO-241: drive nanopb's bundled platformio_generator.py (its library.json
; extraScript). It regenerates lib/NimBLEComm/proto/comms.pb.{c,h} into
; $BUILD_DIR/nanopb/generated-src on every build (md5-cached) and compiles them
; in. PB_ENABLE_MALLOC stays UNDEFINED -> static allocation only (+0 RAM).
custom_nanopb_protos = +<lib/NimBLEComm/proto/comms.proto>
build_flags =
    ${display_common.build_flags}
; PRO-273: force-include the ESP_LOG* -> esp_log_write() tee shim into the
; firmware's own translation units ONLY (build_src_flags scopes to src/, never
; libdeps), so DiagnosticLogPlugin's esp_log_set_vprintf() hook actually captures
; ESP_LOG output. See src/display/EspLogTee.h for the full rationale (and why
; -DUSE_ESP_IDF_LOG can't be used). Inherited by display-headless* / flags-off.
build_src_flags =
    -include src/display/EspLogTee.h

; CAR-385: a build with every optional feature gated OFF. The `#else` stubs the
; feature flags introduce (BLEScalePlugin, MQTT/HomeKit/WebUI registration) are
; compiled NOWHERE by the default envs, so stub drift (a signature that no longer
; mirrors the real class) would only surface on a hand-run flags-off build. CI
; builds this env (.github/workflows/ci.yml) so any drift fails the PR. It only
; flips the feature macros to 0 on top of [env:display]; everything else
; (board, libs, hardening flags) is inherited so the disabled-permutation build
; stays representative.
[env:display-flags-off]
extends = env:display
build_flags =
    ${display_common.build_flags}
    -DGAGGIMATE_ENABLE_BLE_SCALE=0
    -DGAGGIMATE_ENABLE_MQTT=0
    -DGAGGIMATE_ENABLE_HOMEKIT=0
    -DGAGGIMATE_ENABLE_WEBUI=0

[env:display-headless]
extends = env:display
lib_deps =
    ${display_common.lib_deps_default}
    ; PRO-241: headless still links the BLE comms path, so it needs the nanopb
    ; runtime + codegen too. custom_nanopb_protos is inherited from env:display.
    nanopb/Nanopb @ ^0.4.9
build_flags =
    ${display_common.build_flags}
    -DGAGGIMATE_HEADLESS
build_src_filter = -<*> +<display/> +<version.h> +<stable_versions.h> -<display/drivers/> -<display/ui/> -<display/lv_conf.h>

[env:display-headless-8m]
extends = env:display-headless
board = seeed_xiao_esp32s3

[env:display-headless-4m]
extends = env:display-headless
board = esp32-s3-supermini
; PRO-293: the esp32-s3-supermini board JSON pins the stock no_ota.csv, whose app
; slot is only 0x200000 (2 MB). The Arduino-esp32 3.x toolchain (IDF 5.5.4 / xtensa
; gcc 14.2.0) builds a ~2.42 MB firmware that overflows it by ~15.5%. This is a 4 MB
; no-OTA board, so we repartition the single factory app to 3.125 MB (keeping a
; LittleFS data partition) instead of trimming features. Overrides ONLY this env;
; JSON and every other env are untouched. See boards/esp32-s3-supermini-noota-4m.csv.
board_build.partitions = boards/esp32-s3-supermini-noota-4m.csv

[env:controller]
board = Gaggimate-Controller
build_src_filter = -<*> +<controller/> +<version.h>
extra_scripts =
    pre:scripts/auto_firmware_version.py
; PRO-241: the controller is the other BLE end and will eventually need the
; nanopb codegen too. comms.pb.{c,h} are generated into $BUILD_DIR (gitignored)
; from the proto below. No call sites yet (infra slice 1). PB_ENABLE_MALLOC
; stays UNDEFINED -> static allocation only.
custom_nanopb_protos = +<lib/NimBLEComm/proto/comms.proto>
lib_deps =
	GaggiMateController
	FS
	SPIFFS
	ble_ota_dfu
	; PRO-290: NimBLE 1.4.3 -> 2.x on this 6.12.0 platform (see [display_common]
	; and docs/nimble-2x-migration-spike.md). Keep both pins in lockstep.
	; PRO-330: bumped 2.2.3 -> 2.5.0 in lockstep with [display_common] (see the
	; rationale there: 2.3.8 + 2.4.0 fix Arduino-esp32 3.3.x BLE-init crashes).
	h2zero/NimBLE-Arduino@2.5.0
	bblanchon/ArduinoJson@7.4.3
	nanopb/Nanopb @ ^0.4.9
build_flags =
    ; gnu++20 — see docs/cpp-standard-spike.md: enabled by the PRO-293 platform bump
    ; (pioarduino Arduino-esp32 3.x, xtensa gcc 14.2.0 supports C++20). PRO-294.
    -std=c++20
    -std=gnu++20
	-DCORE_DEBUG_LEVEL=3

; -----------------------------------------------------------------------------
; Host-run unit tests (CAR-339)
;
; This environment compiles firmware LOGIC on the dev host (no ESP32/Arduino
; toolchain) so we can unit-test it with PlatformIO's bundled Unity framework:
;
;     pio test -e native
;
; Hardware seams: test/native/Arduino.h is a tiny shim (String + no-op
; ESP_LOG* macros) placed FIRST on the include path so headers that do
; `#include <Arduino.h>` resolve to it instead of the real ESP-IDF. Pure,
; hardware-independent free functions the logic links against (e.g. isSafeId)
; are re-implemented for the host in test/native/*.cpp and pulled in via
; build_src_filter below. ArduinoJson is header-only and builds natively.
;
; See test/README for how to add a test and how the seams work.
; CI wiring for this env is deferred to CAR-340.
; -----------------------------------------------------------------------------
[env:native]
platform = native
framework =
test_framework = unity
monitor_filters =
build_unflags =
check_flags =
; Pull the exact production sources we test in via build_src_filter (compiled as
; project sources) and their headers via -I flags. lib_ignore stops PIO's
; Library Dependency Finder from ALSO building lib/OTA as a library and
; chain-scanning its other sources (GitHubOTA.cpp, ControllerOTA.cpp,
; common.cpp), which #include NimBLE/ESP-only headers (HTTPClient.h,
; WiFiClientSecure.h, ...) that don't exist on the host. (PRO-264)
;
; IMPORTANT (PRO-282): `lib_ignore = OTA` is a BLANKET suppression of LDF
; auto-discovery for the ENTIRE lib/OTA library — it is intentionally blunt
; because PlatformIO has no per-source lib_ignore. It does NOT pick which OTA
; sources are host-safe; that decision lives ENTIRELY in the build_src_filter
; `+<../lib/OTA/src/...>` allow-list below, which is the AUTHORITATIVE list of
; host-safe OTA sources. As of today only semver.c + semver_extensions.cpp are
; host-safe; the rest (common.cpp, GitHubOTA.cpp, ControllerOTA.cpp) pull in
; ESP/Arduino/NimBLE headers and must stay excluded.
;   => If you add a NEW host-safe source to lib/OTA/src that a native test
;      needs, you MUST add an explicit `+<../lib/OTA/src/<file>>` line to the
;      build_src_filter below (and any needed -I to build_flags). The
;      `lib_ignore = OTA` line above deliberately suppresses LDF auto-discovery,
;      so a newly-added host-safe source will NOT be compiled until it is listed
;      explicitly here. Do not assume lib_ignore will "let it through".
lib_ignore = OTA
; Compile the host build-support sources (test/native/*.cpp) and the slice of
; production logic under test (PluginManager.cpp) straight into each test
; program. test_build_src = yes is required for build_src_filter to apply to
; `pio test` builds (it is ignored otherwise).
test_build_src = yes
build_src_filter =
    -<*>
    +<../test/native/>
    +<display/core/PluginManager.cpp>
    ; Production OTA semver logic under test (PRO-264). semver_extensions.cpp
    ; (from_string + render_to_string) wraps the vendored C semver lib; both
    ; live under lib/OTA/src, so pull them straight into the test program.
    ; THIS IS THE AUTHORITATIVE ALLOW-LIST of host-safe lib/OTA sources — add
    ; new host-safe OTA sources here explicitly (PRO-282; see lib_ignore note above).
    +<../lib/OTA/src/semver.c>
    +<../lib/OTA/src/semver_extensions.cpp>
; PRO-242: drive nanopb's bundled codegen on the host too, so the round-trip
; unit tests (test/test_nanopb_comms/) can #include "comms.pb.h" and link the
; generated comms.pb.c. The nanopb library.json extraScript reads this option
; and BuildSources() the generated .pb.c into each test program — no
; build_src_filter entry is needed. Generated into $BUILD_DIR (gitignored).
custom_nanopb_protos = +<lib/NimBLEComm/proto/comms.proto>
build_flags =
    -std=gnu++20
    -I test/native
    -I src
    ; semver_extensions.h / semver.h live in the OTA library dir.
    -I lib/OTA/src
    ; Tell ArduinoJson there is an Arduino-style ::String (our shim) so it
    ; provides the Converter that powers obj["x"].as<String>(). The shim
    ; implements the concat()/operator= surface this enables.
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    ; PRO-242: nanopb runtime + codegen for the host round-trip tests.
    nanopb/Nanopb @ ^0.4.9

; -----------------------------------------------------------------------------
; Sanitized host tests (CAR-341)
;
; Mirrors [env:native] but compiles AND links the host test programs with
; AddressSanitizer + UndefinedBehaviorSanitizer. Run it in CI (and locally) to
; catch memory errors and UB in the platform-independent firmware logic:
;
;     pio test -e native-sanitize
;
; Sanitizer flags must appear on BOTH the compile and link lines, hence the
; duplicated build_flags / build_unflags blocks (PlatformIO has no single
; "link_flags" knob for the native platform's test runner — putting them in
; build_flags makes them flow to the final link too). -fno-omit-frame-pointer
; keeps stack traces readable. ASAN_OPTIONS/UBSAN_OPTIONS in CI set
; halt_on_error=1 / abort_on_error=1 so any finding fails the suite.
; -----------------------------------------------------------------------------
[env:native-sanitize]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
    -g
build_unflags =
    -Os

; -----------------------------------------------------------------------------
; Desktop simulator (CAR-399) — builds the real display firmware natively with
; the BLE link to the controller mocked (sim/comms) and an SDL window as the
; panel (sim/driver). All host shims for Arduino/ESP/FreeRTOS/FS/Preferences/
; WiFi live in sim/platform; the host web server is in sim/web. The WebUI is
; served from this fork's SPIFFS path (sim_data/spiffs/w/), NOT an embedded blob,
; so HomeKit/MQTT/BLE-scale are compiled out via the GAGGIMATE_ENABLE_* flags
; while WebUI stays on. See sim/README.md.
;
; Cross-platform: SDL + socket link flags are injected by scripts/sim_sdl_flags.py
; (sdl2-config on macOS/Linux; explicit SDL2_DIR + ws2_32 Winsock on Windows/MinGW).
; -----------------------------------------------------------------------------
[env:display-sim]
platform = native
framework =
lib_ldf_mode = off
extra_scripts =
    pre:scripts/auto_firmware_version.py
    pre:scripts/generate_stable_versions.py
    ; Generates src/display/webassets/* (manifest + blob .S) before compile;
    ; stubs an empty bundle if build_webui.sh hasn't been run, so the sim links
    ; gWebUiBlobStart without depending on a prior web build. [PRO-215]
    pre:scripts/embed_webui_pre.py
    pre:scripts/sim_sdl_flags.py
    post:scripts/sim_run.py
build_src_filter =
    -<*>
    +<display/>
    +<version.h>
    +<../sim/>
    -<display/main.cpp>
    -<display/drivers/>
    ; webassets/ IS compiled here: web_ui_blob.S defines gWebUiBlobStart (host-safe
    ; — its ESP rodata .section is #if-guarded off for native), so serveWebAsset()
    ; links in the sim. The manifest header is generated by embed_webui_pre.py. [PRO-215]
    -<display/plugins/MQTTPlugin.cpp>
    -<display/plugins/HomekitPlugin.cpp>
    -<display/plugins/mDNSPlugin.cpp>
    -<display/plugins/NetworkWatchdogPlugin.cpp>
    -<display/plugins/WifiStaWatchdogPlugin.cpp>
    -<display/plugins/DiagnosticLogPlugin.cpp>
    ; BLEScalePlugin.cpp is NOT excluded: with GAGGIMATE_ENABLE_BLE_SCALE=0 its
    ; #else branch compiles to just the no-op `BLEScales` global (no NimBLE deps),
    ; which Controller.cpp / ui_events.cpp reference by symbol.
lib_deps =
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@7.4.3
build_unflags =
    -std=gnu++11
build_flags =
    -DGAGGIMATE_SIM
    -std=gnu++20
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_CONF_PATH="${platformio.src_dir}/display/lv_conf.h"
    -DLV_CONF_SUPPRESS_DEFINE_CHECK
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DCORE_DEBUG_LEVEL=0
    ; Match the device's ArduinoJson auto-configuration (Arduino String, no std::string).
    -DARDUINO=10812
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
    ; Keep WebUI on (it is served from the firmware-embedded flash blob via the
    ; same serveWebAsset() path as the device — see sim/README.md §2 [PRO-216])
    ; and compile out the device-only network/BLE features the sim has no backend for.
    -DGAGGIMATE_ENABLE_WEBUI=1
    -DGAGGIMATE_ENABLE_HOMEKIT=0
    -DGAGGIMATE_ENABLE_MQTT=0
    -DGAGGIMATE_ENABLE_BLE_SCALE=0
