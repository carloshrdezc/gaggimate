; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
check_flags = 
	cppcheck: --enable=all --inline-suppr --suppress=*:*/.pio/*
monitor_filters =
    esp32_exception_decoder
    time
    default

[display_common]
build_flags =
    ; C++ standard stays at gnu++17. CAR-340 slice-1 spike (docs/cpp-standard-spike.md)
    ; verified the espressif32@6.12.0 xtensa toolchain is gcc 8.4.0, which rejects
    ; -std=gnu++20 (unrecognized option) and lacks <span>/<ranges>/concepts. Moving to
    ; C++20 needs a platform/core bump first; do NOT change this flag without one.
    -std=c++17
    -std=gnu++17
    ; CAR-341: compiler hardening. -Wall -Wextra surface bug-prone constructs on
    ; the firmware build. NOT -Werror on purpose — keeping CI green matters more
    ; than zero warnings today (see issue: "consider -Werror once clean").
    -Wall
    -Wextra
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_CONF_PATH="${platformio.src_dir}/display/lv_conf.h"
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DLV_CONF_SUPPRESS_DEFINE_CHECK
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_CMN
    -Os
    -DCONFIG_MAX_FILENAME_LEN=64
    -DCONFIG_MAX_URL_LEN=128
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=0
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
    -DCONFIG_ASYNC_TCP_PRIORITY=10
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DDEFAULT_MAX_WS_CLIENTS=4
lib_deps_default =
    FS
    SPIFFS
    Wire
    SPI
    ble_ota_dfu
    h2zero/NimBLE-Arduino@^1.4.0
    https://github.com/ESP32Async/AsyncTCP.git#v3.4.9
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.9.1
    bblanchon/ArduinoJson@^7.2.1
    256dpi/MQTT@^2.5.2
    https://github.com/gaggimate/esp-arduino-ble-scales#5f8f2cd
    homespan/HomeSpan@1.9.1
    links2004/WebSockets@^2.4.1

[env:display]
board = LilyGo-T-RGB
upload_speed = 921600
build_src_filter = -<*> +<display/> +<version.h> +<stable_versions.h>
extra_scripts =
	pre:scripts/auto_firmware_version.py
	pre:scripts/generate_stable_versions.py
lib_deps =
    ${display_common.lib_deps_default}
    lewisxhe/SensorLib @ 0.2.3
    bodmer/TFT_eSPI @ 2.5.43
	lvgl/lvgl @ 8.4.0
	moononournation/GFX Library for Arduino @ 1.5.9
build_flags =
    ${display_common.build_flags}

[env:display-headless]
extends = env:display
lib_deps =
    ${display_common.lib_deps_default}
build_flags =
    ${display_common.build_flags}
    -DGAGGIMATE_HEADLESS
build_src_filter = -<*> +<display/> +<version.h> +<stable_versions.h> -<display/drivers/> -<display/ui/> -<display/lv_conf.h>

[env:display-headless-8m]
extends = env:display-headless
board = seeed_xiao_esp32s3

[env:display-headless-4m]
extends = env:display-headless
board = esp32-s3-supermini

[env:controller]
board = Gaggimate-Controller
build_src_filter = -<*> +<controller/> +<version.h>
extra_scripts =
    pre:scripts/auto_firmware_version.py
lib_deps =
	GaggiMateController
	FS
	SPIFFS
	ble_ota_dfu
	h2zero/NimBLE-Arduino@^1.4.0
	bblanchon/ArduinoJson@^7.2.1
build_flags =
    ; gnu++17 — see docs/cpp-standard-spike.md (CAR-340 slice 1): gcc 8.4.0 has no C++20.
    -std=c++17
    -std=gnu++17
	-DCORE_DEBUG_LEVEL=3

; -----------------------------------------------------------------------------
; Host-run unit tests (CAR-339)
;
; This environment compiles firmware LOGIC on the dev host (no ESP32/Arduino
; toolchain) so we can unit-test it with PlatformIO's bundled Unity framework:
;
;     pio test -e native
;
; Hardware seams: test/native/Arduino.h is a tiny shim (String + no-op
; ESP_LOG* macros) placed FIRST on the include path so headers that do
; `#include <Arduino.h>` resolve to it instead of the real ESP-IDF. Pure,
; hardware-independent free functions the logic links against (e.g. isSafeId)
; are re-implemented for the host in test/native/*.cpp and pulled in via
; build_src_filter below. ArduinoJson is header-only and builds natively.
;
; See test/README for how to add a test and how the seams work.
; CI wiring for this env is deferred to CAR-340.
; -----------------------------------------------------------------------------
[env:native]
platform = native
framework =
test_framework = unity
monitor_filters =
build_unflags =
check_flags =
; Compile the host build-support sources (test/native/*.cpp) and the slice of
; production logic under test (PluginManager.cpp) straight into each test
; program. test_build_src = yes is required for build_src_filter to apply to
; `pio test` builds (it is ignored otherwise).
test_build_src = yes
build_src_filter =
    -<*>
    +<../test/native/>
    +<display/core/PluginManager.cpp>
build_flags =
    -std=gnu++17
    -I test/native
    -I src
    ; Tell ArduinoJson there is an Arduino-style ::String (our shim) so it
    ; provides the Converter that powers obj["x"].as<String>(). The shim
    ; implements the concat()/operator= surface this enables.
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
lib_deps =
    bblanchon/ArduinoJson@^7.2.1

; -----------------------------------------------------------------------------
; Sanitized host tests (CAR-341)
;
; Mirrors [env:native] but compiles AND links the host test programs with
; AddressSanitizer + UndefinedBehaviorSanitizer. Run it in CI (and locally) to
; catch memory errors and UB in the platform-independent firmware logic:
;
;     pio test -e native-sanitize
;
; Sanitizer flags must appear on BOTH the compile and link lines, hence the
; duplicated build_flags / build_unflags blocks (PlatformIO has no single
; "link_flags" knob for the native platform's test runner — putting them in
; build_flags makes them flow to the final link too). -fno-omit-frame-pointer
; keeps stack traces readable. ASAN_OPTIONS/UBSAN_OPTIONS in CI set
; halt_on_error=1 / abort_on_error=1 so any finding fails the suite.
; -----------------------------------------------------------------------------
[env:native-sanitize]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
    -g
build_unflags =
    -Os
